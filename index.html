<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGOPro YDK Generator & Konverter</title>
    <style>
        :root {
            --bg-color: #121214;
            --surface-color: #1a1a1e;
            --border-color: #2c2d35;
            --accent-color: #0088cc;
            --accent-hover: #00a2f5;
            --text-main: #e6e6e6;
            --text-muted: #8c8d96;
            --success: #2ecc71;
            --warning: #f39c12;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 280px;
            background-color: var(--bg-color);
            color: #4af626;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.85rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex-grow: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 0.8rem;
            border-radius: 4px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            gap: 0.4rem;
        }

        .stat-valid {
            color: var(--success);
            font-weight: bold;
        }

        .stat-invalid {
            color: var(--warning);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YGOPro .YDK Konverter</h1>
    <p>Füge die Ausgabe des Assistenten hier ein. Der Konverter isoliert automatisch die Abschnitte <code>#main</code>, <code>#extra</code> und <code>!side</code>, entfernt störende Kommentare und baut die Datei nach offizieller Spezifikation.</p>
    
    <textarea id="deckInput" placeholder="#main&#10;89631139&#10;...&#10;#extra&#10;...&#10;!side"></textarea>

    <div class="controls">
        <input type="text" id="fileName" placeholder="DeckName (ohne .ydk)" value="CustomDeck">
        <button onclick="processAndDownload()">Als .YDK herunterladen</button>
    </div>

    <div class="stats" id="statsBar">
        <div class="stat-item">Main Deck: <span id="mainCount" class="stat-invalid">0</span></div>
        <div class="stat-item">Extra Deck: <span id="extraCount" class="stat-valid">0</span></div>
        <div class="stat-item">Side Deck: <span id="sideCount" class="stat-valid">0</span></div>
    </div>
</div>

<script>
    const inputArea = document.getElementById('deckInput');
    const mainCountEl = document.getElementById('mainCount');
    const extraCountEl = document.getElementById('extraCount');
    const sideCountEl = document.getElementById('sideCount');

    function parseDeck(text) {
        const lines = text.split(/\r?\n/);
        let section = '';
        const main = [];
        const extra = [];
        const side = [];

        for (let rawLine of lines) {
            let line = rawLine.trim();
            if (!line) continue;

            if (line.startsWith('#main')) {
                section = 'main';
                continue;
            } else if (line.startsWith('#extra')) {
                section = 'extra';
                continue;
            } else if (line.startsWith('!side')) {
                section = 'side';
                continue;
            }

            // Extrahiere die erste 8-stellige Zahl der Zeile (ignoriert Text/Kommentare)
            const match = line.match(/\b\d{4,9}\b/);
            if (match) {
                const id = match[0];
                if (section === 'main') main.push(id);
                else if (section === 'extra') extra.push(id);
                else if (section === 'side') side.push(id);
            }
        }
        return { main, extra, side };
    }

    function updateStats() {
        const { main, extra, side } = parseDeck(inputArea.value);
        
        mainCountEl.textContent = main.length;
        mainCountEl.className = (main.length >= 40 && main.length <= 60) ? 'stat-valid' : 'stat-invalid';

        extraCountEl.textContent = extra.length;
        extraCountEl.className = (extra.length <= 15) ? 'stat-valid' : 'stat-invalid';

        sideCountEl.textContent = side.length;
        sideCountEl.className = (side.length <= 15) ? 'stat-valid' : 'stat-invalid';
    }

    inputArea.addEventListener('input', updateStats);

    function processAndDownload() {
        const { main, extra, side } = parseDeck(inputArea.value);

        if (main.length === 0 && extra.length === 0 && side.length === 0) {
            alert('Keine gültigen Karten-IDs gefunden. Bitte Eingabe prüfen.');
            return;
        }

        let ydkContent = '#created by YGO Deck Architect\n';
        ydkContent += '#main\n' + main.join('\n') + '\n';
        ydkContent += '#extra\n' + extra.join('\n') + '\n';
        ydkContent += '!side\n' + side.join('\n') + '\n';

        const rawTitle = document.getElementById('fileName').value.trim();
        const safeTitle = (rawTitle || 'Deck').replace(/[^a-zA-Z0-9_\-]/g, '_');

        const blob = new Blob([ydkContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = safeTitle + '.ydk';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
